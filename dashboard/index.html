<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axiom Skills — Catalog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Axiom Skills</h1>
    <p id="tagline"></p>
    <div id="counts"></div>
  </header>
  <main>
    <section id="bundles-section">
      <h2>Bundles</h2>
      <div id="bundles"></div>
    </section>
    <section>
      <h2>Catalog</h2>
      <input id="search" type="search" placeholder="Search skills, triggers, descriptions…" />
      <div id="skills"></div>
    </section>
  </main>
  <footer>
    <p>Generated from <code>.claude-plugin/marketplace.json</code> + skill frontmatter.
       Install: <code>/plugin marketplace add TheAxiomFoundation/axiom-skills</code></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
