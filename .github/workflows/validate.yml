name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Marketplace manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8')); console.log('ok')"
      - name: MCP config parses
        run: node -e "JSON.parse(require('fs').readFileSync('mcp/axiom.json','utf8')); console.log('ok')"
      - name: Skills valid and catalog not stale
        run: node scripts/build-catalog.mjs --check
